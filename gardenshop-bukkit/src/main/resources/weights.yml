# ============================================================================
#  weights.yml - authoritative weight range (kg) per Mythic drop type
# ============================================================================
#
#  GENERATED from growGardenItems.yml - regenerate with scripts/gen-weights.ps1
#  after adding crops to the pack. Safe to hand-edit afterwards.
#
#  The plugin rolls the weight from this range and stores it in the item's
#  PersistentDataContainer, then rewrites the lore with 2 decimals. The pack's
#  own <random.AAtoBB> lore is NOT trusted: MythicMobs does not zero-pad it, so
#  '1.<random.00to30>' can render as '1.9kg' when 1.09kg was meant. The ranges
#  below are the author's INTENDED values, recovered from those pairs.
#
#  Any drop type missing here falls back to its crop's base range in crops.yml.
# ============================================================================

